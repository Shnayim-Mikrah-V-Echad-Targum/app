# Supabase CLI configuration for local development (`supabase start`).
# For a hosted project, apply the same settings in the dashboard — see
# docs/BACKEND.md.
project_id = "shnayim-mikra"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:8080"
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
# Sign-in uses a 6-digit code typed into the app (no deep links needed on
# Windows, desktop browsers or mobile).
otp_length = 6
otp_expiry = 900
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Your Shnayim Mikra sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your Shnayim Mikra sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
