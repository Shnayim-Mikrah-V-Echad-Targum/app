# ONNX Runtime for Windows, which flutter_onnxruntime downloads itself without
# checking the download (a missing file surfaces only as "ONNX Runtime
# extraction directory doesn't exist"): fetched here, checked, and kept in the
# cache, unpacked where the plugin looks for it, so that it skips its own
# download. Before `flutter build windows`, in the repository's root.
name: ONNX Runtime for Windows
description: Puts ONNX Runtime where flutter_onnxruntime looks for it, from the cache or Microsoft's release.
inputs:
  version:
    description: The plugin's ONNX Runtime version (ONNXRUNTIME_VERSION in its windows/CMakeLists.txt).
    default: "1.28.3"
  token:
    description: A token for the GitHub CLI.
    required: true
runs:
  using: composite
  steps:
    - name: ONNX Runtime for Windows, from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: build/windows/x64/plugins/flutter_onnxruntime/onnxruntime
        key: onnxruntime-win-x64-${{ inputs.version }}
    - name: ONNX Runtime for Windows, from Microsoft's release
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        $name = "onnxruntime-win-x64-$env:VERSION"
        $dir = 'build/windows/x64/plugins/flutter_onnxruntime/onnxruntime'
        # The plugin's version, or else the newest release of the same minor
        # version with a Windows zip (patch releases keep its interface):
        # Microsoft's releases have been moved about since 2026-11-20.
        $minor = ($env:VERSION -split '\.')[0..1] -join '.'
        $tags = @("v$env:VERSION") + @(gh release list --repo microsoft/onnxruntime --limit 100 --json tagName --jq '.[].tagName' |
          Where-Object { $_ -like "v$minor.*" -and $_ -ne "v$env:VERSION" })
        $found = $null
        foreach ($tag in $tags) {
          $v = $tag.TrimStart('v')
          gh release download $tag --repo microsoft/onnxruntime --pattern "onnxruntime-win-x64-$v.zip" --dir $env:RUNNER_TEMP 2>$null
          if ($LASTEXITCODE -eq 0) { $found = $v; break }
        }
        if (-not $found) {
          Write-Output "::error::No onnxruntime-win-x64 zip for $minor.x could be fetched from microsoft/onnxruntime's releases. Its latest releases:"
          gh release list --repo microsoft/onnxruntime --limit 15
          exit 1
        }
        if ($found -ne $env:VERSION) { Write-Output "::warning::ONNX Runtime $env:VERSION has no Windows release; using $found in its place." }
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        Expand-Archive -Path "$env:RUNNER_TEMP/onnxruntime-win-x64-$found.zip" -DestinationPath $dir -Force
        # Where the plugin looks: under its own version's name.
        if ($found -ne $env:VERSION) { Rename-Item -Path "$dir/onnxruntime-win-x64-$found" -NewName $name }
        if (-not (Test-Path "$dir/$name/include/onnxruntime_cxx_api.h")) {
          Write-Output "::error::onnxruntime-win-x64-$found.zip did not hold include/onnxruntime_cxx_api.h"
          exit 1
        }
