# ONNX Runtime for Windows, where flutter_onnxruntime looks for it, so that the
# plugin skips its own download: the GitHub release it downloads from
# (microsoft/onnxruntime) has been gone since November 2026, and the plugin
# never checks its download, so a failed one surfaced only as "ONNX Runtime
# extraction directory doesn't exist". Taken instead from Microsoft's NuGet
# package, checked against its SHA-256, laid out as the release's zip was
# (include/, lib/onnxruntime.lib and .dll), and kept in the Actions cache.
# Before `flutter build windows`, in the repository's root. The version is
# ONNXRUNTIME_VERSION in windows/CMakeLists.txt.
name: ONNX Runtime for Windows
description: Puts ONNX Runtime where flutter_onnxruntime looks for it, from the cache or Microsoft's NuGet package.
inputs:
  version:
    description: ONNX Runtime's version, as windows/CMakeLists.txt sets ONNXRUNTIME_VERSION.
    default: "1.28.0"
  sha256:
    description: The SHA-256 of Microsoft.ML.OnnxRuntime's .nupkg of that version.
    default: "769d1d3ea8ab6cd69f737c9dd4d4462aa4ad0ccfa106eaf506efc40d7bead5db"
runs:
  using: composite
  steps:
    - name: ONNX Runtime for Windows, from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: build/windows/x64/plugins/flutter_onnxruntime/onnxruntime
        key: onnxruntime-win-x64-${{ inputs.version }}-${{ inputs.sha256 }}
    - name: ONNX Runtime for Windows, from Microsoft's NuGet package
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $package = "$env:RUNNER_TEMP/onnxruntime.$env:VERSION.nupkg"
        Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$env:VERSION/microsoft.ml.onnxruntime.$env:VERSION.nupkg" -OutFile $package
        $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLower()
        if ($hash -ne $env:SHA256) {
          Write-Output "::error::Microsoft.ML.OnnxRuntime $env:VERSION from NuGet has SHA-256 $hash, not the $env:SHA256 expected"
          exit 1
        }
        $unpacked = "$env:RUNNER_TEMP/onnxruntime-nupkg"
        Expand-Archive -Path $package -DestinationPath $unpacked -Force
        $dir = "build/windows/x64/plugins/flutter_onnxruntime/onnxruntime/onnxruntime-win-x64-$env:VERSION"
        New-Item -ItemType Directory -Force -Path "$dir/include", "$dir/lib" | Out-Null
        Copy-Item "$unpacked/build/native/include/*" "$dir/include"
        Copy-Item "$unpacked/runtimes/win-x64/native/*" "$dir/lib"
        foreach ($file in 'include/onnxruntime_cxx_api.h', 'lib/onnxruntime.lib', 'lib/onnxruntime.dll') {
          if (-not (Test-Path "$dir/$file")) {
            Write-Output "::error::Microsoft.ML.OnnxRuntime $env:VERSION has no $file"
            exit 1
          }
        }
