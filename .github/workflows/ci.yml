name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  # Optional community backend. The publishable key is public by design
  # (row-level security protects the data); set these as repository
  # variables. Without them the app runs its on-device demo community.
  DART_DEFINES: >-
    --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
    --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/branding/requirements.txt
      # The glyph-order assertion behind the icon's Hebrew (DESIGN.md §9).
      # cairosvg needs Cairo, which ubuntu-latest has.
      - name: Check the icon generator shapes the Hebrew right to left
        run: |
          pip install -r tool/branding/requirements.txt
          python3 -m unittest discover -s tool/branding
      - name: Check the Hebrew translation is complete and up to date
        run: |
          python3 tool/l10n/build_he.py
          git diff --exit-code lib/l10n/app_he.arb
      - name: Check the static policy pages build
        run: node --test tool/legal/build_html.test.mjs
      - run: flutter analyze
      - run: flutter test
      - name: Community database tests (PostgreSQL)
        run: supabase/tests/run_tests.sh

  web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (self-hosted engine, no third-party CDN)
        run: |
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run \
            --base-href "${{ vars.WEB_BASE_HREF || '/' }}" $DART_DEFINES
      # The public privacy, support and account-deletion pages the stores
      # ask for, as static HTML in build/web/legal/ (docs/RELEASE.md).
      - name: Static policy, support and account-deletion pages
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: node tool/legal/build_html.mjs build/web
      # Link previews want absolute URLs; vars.WEB_URL is the site's public
      # address (for example https://example.org/app/).
      - name: Absolute link-preview URLs
        if: vars.WEB_URL != ''
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          url="${WEB_URL%/}/"
          sed -i \
            -e "s|<link rel=\"canonical\" href=\"./\">|<link rel=\"canonical\" href=\"$url\">\n  <meta property=\"og:url\" content=\"$url\">|" \
            -e "s|<meta property=\"og:image\" content=\"og.png\">|<meta property=\"og:image\" content=\"${url}og.png\">|" \
            build/web/index.html
          grep -q "content=\"${url}og.png\"" build/web/index.html
      # Last, so it precaches the finished files (workbox-config.cjs).
      - name: Offline service worker
        run: npx --yes workbox-cli@7.4.1 generateSW workbox-config.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_WEB == 'true'
        with:
          path: build/web

  deploy-web:
    name: Deploy web to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_WEB == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing (only if the keystore secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter build apk --release $DART_DEFINES
      - run: flutter build appbundle --release $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          # Without the keystore secrets (as in pull requests from forks), the
          # release build is signed with the debug key, which Google Play
          # refuses; the name says so.
          name: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'android' || 'android-debug-signed' }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign $DART_DEFINES

  windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release ${{ env.DART_DEFINES }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release
      - name: Package as MSIX (signed with the certificate, if it is configured)
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERTIFICATE_BASE64" ]; then
            certificate="$RUNNER_TEMP/certificate.pfx"
            echo "$CERTIFICATE_BASE64" | base64 -d > "$certificate"
            bash tool/windows/make_msix.sh \
              --certificate-path "$certificate" --certificate-password "$CERTIFICATE_PASSWORD"
            rm "$certificate"
          else
            bash tool/windows/make_msix.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          # Without the certificate secrets (as in pull requests from forks),
          # the package is signed with the msix tool's public test
          # certificate, which a machine must trust before it will install
          # the package (docs/RELEASE.md); the name says so.
          name: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && 'windows-msix' || 'windows-msix-test-signed' }}
          path: build/windows/msix/ShnayimMikra.msix
          if-no-files-found: error
