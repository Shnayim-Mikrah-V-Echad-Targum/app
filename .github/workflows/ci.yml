name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  # WEB_URL, the web app's public address: the community, its accounts and
  # the backup run on that site's server (its Worker, in the private website repository), a
  # discussion's Copy link gives it, and the link previews below use it.
  # Without it the app runs its on-device demo community. INSTALL_URL,
  # optional, is where the web offers the installed app.
  DART_DEFINES: >-
    --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
    --dart-define=INSTALL_URL=${{ vars.INSTALL_URL }}
    --dart-define=WEB_URL=${{ vars.WEB_URL }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/branding/requirements.txt
      # The glyph-order assertion behind the icon's Hebrew (DESIGN.md §9).
      # cairosvg needs Cairo, which ubuntu-latest has.
      - name: Check the icon generator shapes the Hebrew right to left
        run: |
          pip install -r tool/branding/requirements.txt
          python3 -m unittest discover -s tool/branding
      # The store listings' text against the stores' limits, and the framing
      # of their screenshots (docs/RELEASE.md, Store listing).
      - name: Check the store listings
        run: python3 -m unittest discover -s tool/store
      # The Release workflow's App Store signing, against the Xcode project.
      - name: Check the App Store signing script
        run: python3 -m unittest discover -s tool/ios
      - name: Check the Hebrew translation is complete and up to date
        run: |
          python3 tool/l10n/build_he.py
          git diff --exit-code lib/l10n/app_he.arb
      - name: Check the static policy pages, the web build's scripts and the site's Worker
        run: node --test tool/legal/build_html.test.mjs tool/web/web.test.mjs
      - run: flutter analyze
      - run: flutter test
      # Dart's local time follows the process's time zone, UTC on the runner,
      # which never changes its clocks.
      - name: Check the day turns at 3 a.m. across Israel's changes of clocks
        run: TZ=Asia/Jerusalem flutter test test/app/rollover_test.dart

  web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (self-hosted engine, no third-party CDN)
        run: |
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run \
            --base-href "${{ vars.WEB_BASE_HREF || '/' }}" $DART_DEFINES
      # The first frame waits for every font in the manifest: index.html
      # starts downloading them all while the engine loads.
      - name: Preload the start-up fonts
        run: node tool/web/preload_fonts.mjs build/web
      # main.dart.js, which a first visit downloads before anything shows,
      # against its budget in bytes gzipped: the repository variable
      # BUDGET_MAIN_JS_GZIP, or else the budget docs/RELEASE.md records (Web).
      # The summary gives its deferred parts and the start-up fonts too.
      - name: Bundle size budget
        env:
          BUDGET: ${{ vars.BUDGET_MAIN_JS_GZIP || '1527297' }}
        run: |
          [[ "$BUDGET" =~ ^[0-9]+$ ]] || { echo "::error::BUDGET_MAIN_JS_GZIP is not a number of bytes: $BUDGET"; exit 1; }
          gzipped() { gzip -9c "$1" | wc -c; }
          kb() { awk -v n="$1" 'BEGIN { printf "%.1f KB", n / 1024 }'; }
          size=$(gzipped build/web/main.dart.js)
          parts=0 part_count=0
          for part in build/web/main.dart.js_*.part.js; do
            [ -e "$part" ] || continue
            parts=$((parts + $(gzipped "$part"))) part_count=$((part_count + 1))
          done
          assets=$(jq -r '[.[].fonts[].asset] | unique | .[]' build/web/assets/FontManifest.json)
          fonts=0 font_count=0
          while read -r asset; do
            fonts=$((fonts + $(wc -c < "build/web/assets/$asset"))) font_count=$((font_count + 1))
          done <<< "$assets"
          {
            echo '### Web first load'
            echo
            echo '| | Size |'
            echo '| --- | ---: |'
            echo "| main.dart.js, gzipped | $(kb "$size") ($size bytes, budget $BUDGET) |"
            echo "| Deferred parts ($part_count), gzipped | $(kb "$parts") |"
            echo "| Start-up fonts ($font_count) | $(kb "$fonts") |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$BUDGET" ]; then
            echo "::error file=build/web/main.dart.js::main.dart.js is $size bytes gzipped, over its budget of $BUDGET (docs/RELEASE.md, Web)"
            exit 1
          fi
          # The time-zone database stays in its deferred part, however small
          # a database might be imported at once in its place.
          if grep -q 'America/New_York' build/web/main.dart.js; then
            echo "::error file=lib/core/calendar/tz_database.dart::main.dart.js holds time-zone data: import package:timezone/data/ only as a deferred library"
            exit 1
          fi
      # The public privacy, support and account-deletion pages the stores
      # ask for, as static HTML in build/web/legal/ (docs/RELEASE.md).
      - name: Static policy, support and account-deletion pages
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: node tool/legal/build_html.mjs build/web
      # Link previews want absolute URLs; vars.WEB_URL is the site's public
      # address (https://shnayimmikrah.org/).
      - name: Absolute link-preview URLs
        if: vars.WEB_URL != ''
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          url="${WEB_URL%/}/"
          sed -i \
            -e "s|<link rel=\"canonical\" href=\"./\">|<link rel=\"canonical\" href=\"$url\">\n  <meta property=\"og:url\" content=\"$url\">|" \
            -e "s|<meta property=\"og:image\" content=\"og.png\">|<meta property=\"og:image\" content=\"${url}og.png\">|" \
            build/web/index.html
          grep -q "content=\"${url}og.png\"" build/web/index.html
      # Each of the app's pages has an address of its own (…/community/
      # thread/1). GitHub Pages serves 404.html for an address it has no file
      # for, so a link to a page, or a reload, opens the app there; once the
      # service worker is in, it serves index.html for them itself.
      - name: The app at every page's address
        run: cp build/web/index.html build/web/404.html
      # Last, so it precaches the finished files (workbox-config.cjs).
      - name: Offline service worker
        run: |
          npx --yes workbox-cli@7.4.1 generateSW workbox-config.cjs
          # Workbox only warns of a file it leaves out; without the app's
          # own files, the app never opens offline.
          node tool/web/sw_build.cjs check build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_WEB == 'true'
        with:
          path: build/web

  deploy-web:
    name: Deploy web to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_WEB == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The site's own web build, for shnayimmikrah.org: the app built with the
  # site's address (so its community is the site's, not the demo), with the
  # web job's finishing steps, published as site.zip on the rolling
  # pre-release web-latest. The site's Worker, in its own repository, serves
  # it: its build fetches this file when it has no build of its own.
  site-web:
    name: Publish the site's web build
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: https://shnayimmikrah.org/
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build for the site
        run: |
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --base-href / \
            --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }} \
            --dart-define=INSTALL_URL=${{ vars.INSTALL_URL }} \
            --dart-define=WEB_URL=$SITE_URL
      - run: node tool/web/preload_fonts.mjs build/web
      - name: Static policy, support and account-deletion pages
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: node tool/legal/build_html.mjs build/web
      - name: Absolute link-preview URLs
        run: |
          url="${SITE_URL%/}/"
          sed -i \
            -e "s|<link rel=\"canonical\" href=\"./\">|<link rel=\"canonical\" href=\"$url\">\n  <meta property=\"og:url\" content=\"$url\">|" \
            -e "s|<meta property=\"og:image\" content=\"og.png\">|<meta property=\"og:image\" content=\"${url}og.png\">|" \
            build/web/index.html
          grep -q "content=\"${url}og.png\"" build/web/index.html
      - run: cp build/web/index.html build/web/404.html
      - name: Offline service worker
        run: |
          npx --yes workbox-cli@7.4.1 generateSW workbox-config.cjs
          node tool/web/sw_build.cjs check build/web
      - name: Publish as web-latest/site.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/web && zip -qr "$RUNNER_TEMP/site.zip" .)
          if ! gh release view web-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create web-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Web build for shnayimmikrah.org" \
              --notes "The web app as shnayimmikrah.org serves it, rebuilt from main on every push. Not a release for download."
          fi
          gh release upload web-latest "$RUNNER_TEMP/site.zip" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing (only if the keystore secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter build apk --release $DART_DEFINES
      - run: flutter build appbundle --release $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          # Without the keystore secrets (as in pull requests from forks), the
          # release build is signed with the debug key, which Google Play
          # refuses; the name says so. Either way it is CI's, with whatever
          # configuration CI has, never for the store (docs/RELEASE.md): the
          # Release workflow's is android-release-aab.
          name: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'android-ci' || 'android-ci-debug-signed' }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign $DART_DEFINES
      # The widget extension, built with the app, links none of its
      # frameworks (ios/ParshaWidget/ParshaWidget.xcconfig): neither a
      # plugin's nor the Flutter engine, which WidgetKit would load each time
      # it draws the widget.
      - name: The widget extension links none of the app's frameworks
        run: |
          widget=build/ios/iphoneos/Runner.app/PlugIns/ParshaWidget.appex/ParshaWidget
          otool -L "$widget"
          if otool -L "$widget" | tail -n +2 | grep -E '@rpath/.*\.framework/|@executable_path|@loader_path'; then
            echo "::error file=ios/ParshaWidget/ParshaWidget.xcconfig::The widget extension links the app's frameworks"
            exit 1
          fi

  windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release ${{ env.DART_DEFINES }}
        shell: bash
      # The folder runs on a PC without the Visual C++ Redistributable only
      # with the runtime beside the executable (windows/CMakeLists.txt).
      - name: The Visual C++ runtime is in the folder
        shell: bash
        run: |
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            if [ ! -f "build/windows/x64/runner/Release/$dll" ]; then
              echo "::error file=windows/CMakeLists.txt::$dll is missing from the Windows build, which then won't start on a PC without the Visual C++ Redistributable"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release
      # The installer the pre-releases ship (.github/workflows/prerelease.yml),
      # so that every pull request compiles its WiX source. Before the MSIX,
      # whose msix tool takes the Visual C++ runtime out of the folder. WiX
      # comes with the .NET SDK (tool/windows/build_msi.ps1).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the MSI
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tool\windows\build_msi.ps1 -ReleaseDir build\windows\x64\runner\Release
      - uses: actions/upload-artifact@v4
        with:
          # Unsigned, with whatever configuration CI has: release a
          # pre-release's installer, not CI's (docs/RELEASE.md, Pre-releases).
          name: windows-msi
          path: build/windows/msi/*.msi
          if-no-files-found: error
      - name: Package as MSIX (signed with the certificate, if it is configured)
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERTIFICATE_BASE64" ]; then
            certificate="$RUNNER_TEMP/certificate.pfx"
            echo "$CERTIFICATE_BASE64" | base64 -d > "$certificate"
            bash tool/windows/make_msix.sh \
              --certificate-path "$certificate" --certificate-password "$CERTIFICATE_PASSWORD"
            rm "$certificate"
          else
            bash tool/windows/make_msix.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          # Without the certificate secrets (as in pull requests from forks),
          # the package is signed with the msix tool's public test
          # certificate, which a machine must trust before it will install
          # the package (docs/RELEASE.md); the name says so.
          name: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && 'windows-msix' || 'windows-msix-test-signed' }}
          path: build/windows/msix/ShnayimMikrah.msix
          if-no-files-found: error
