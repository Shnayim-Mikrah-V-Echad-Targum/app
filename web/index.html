    // Reduce Motion and language. shared_preferences keeps the settings in
    // localStorage as JSON inside a JSON string.
    (function () {
      var settings = {};
      try {
        settings = JSON.parse(JSON.parse(localStorage.getItem('flutter.settings.v1') || '"{}"')) || {};

      var root = document.documentElement;
      var themes = ['light', 'dark', 'sepia', 'highContrastLight', 'highContrastDark'];
      if (themes.indexOf(settings.theme) >= 0) root.setAttribute('data-theme', settings.theme);
      if (settings.reduceMotion === true) root.setAttribute('data-reduce-motion', '');
      var hebrew = settings.language === 'hebrew';
      if (!settings.language || settings.language === 'system') {
        // As Flutter resolves the system's language: the first of the
        // browser's languages that the app has (Flutter reads iw as he).
        var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];

          var code = String(languages[i]).toLowerCase().split('-')[0];

          if (code === 'he' || code === 'iw' || code === 'en') break;
