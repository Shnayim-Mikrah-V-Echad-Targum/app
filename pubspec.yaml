name: shnayim_mikra
description: "Shnayim Mikra v'Echad Targum — the weekly parsha twice in Hebrew and once in Targum, with daily and weekly streaks, community forums and extensive accessibility options."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  intl: any
  package_info_plus: ^10.2.2
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  msix: ^3.18.0
  yaml: ^3.1.3

# Platform icons and launch screens. Regenerate all of them with:
#   python3 tool/branding/make_icon.py && dart run flutter_launcher_icons \
#     && dart run flutter_native_splash:create \
#     && python3 tool/branding/make_icon.py --post
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#1D3F75"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # The art already sits inside the 66/108 safe circle.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: assets/branding/icon_dark.png
  image_path_ios_tinted_grayscale: assets/branding/icon_tinted.png
  web:
    generate: true
    background_color: "#FAF7F0"
    theme_color: "#1D3F75"
  windows:
    # make_icon.py --post writes the multi-size windows/runner/resources/app_icon.ico.
    generate: false

# Android and iOS launch screens: the mark's tile on the app's own background
# (DESIGN_SYSTEM.md §3.6), so a cold start never flashes white and the first
# frame takes over without a jump. The web build has its own (web/index.html).
flutter_native_splash:
  color: "#FAF7F0"
  color_dark: "#14120F"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#FAF7F0"
    color_dark: "#14120F"
    # The tile stays inside the 192 dp circle Android 12 shows; no icon
    # background, so the tile sits straight on the screen's colour.
    image: assets/branding/splash_logo.png
  web: false
  # The status bar stays visible, iOS's default, so Info.plist needs nothing:
  # an empty list keeps the tool from rewriting (and reformatting) it.
  info_plist_files: []

# The Windows MSIX installer: build with `flutter build windows --release`,
# then package with tool/windows/make_msix.sh (docs/RELEASE.md).
msix_config:
  display_name: Shnayim Mikra
  publisher_display_name: Shnayim Mikra
  # The app id on every platform. The Microsoft Store assigns its own, passed
  # with --identity-name when packaging for it.
  identity_name: org.shnayimmikra.app
  output_name: ShnayimMikra
  # The rounded tile of app_icon.ico; make_icon.py --post writes it.
  logo_path: windows/msix/logo.png
  languages: en-us, he-il
  # The community and cloud backup.
  capabilities: internetClient
  # Lets a reminder's notification come back to the running app. The class
  # id is the guid in WindowsInitializationSettings
  # (lib/services/notifications.dart).
  toast_activator:
    clsid: 7c1d6a3e-5b2f-4d8e-9a61-3f0c2e8b4d57
    display_name: Shnayim Mikra
  # Package the build that was made with the release dart-defines, instead
  # of building again without them.
  build_windows: false
  # Never ask to trust the test certificate (and never block CI asking).
  install_certificate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/icon.png
    - assets/branding/mark_128.png
    - assets/data/
    - assets/text/
    - assets/text/mikra/
    - assets/text/onkelos/
    - assets/text/english/
    - assets/text/rashi/
    - assets/text/rashi_en/
    - assets/fonts/licenses/
    # Optional fonts: plain assets that OptionalFonts registers on first use,
    # so the web build does not download them at start-up. optional/ holds
    # the scripture and interface fonts a reader may choose.
    - assets/fonts/rashi/
    - assets/fonts/optional/

  fonts:
    # The default scripture font, with nikud and the full set of ta'amim.
    # The other scripture fonts (Taamey Frank, Ezra SIL) load on demand from
    # assets/fonts/optional/ (lib/services/optional_fonts.dart).
    - family: NotoSerifHebrew
      fonts:
        - asset: assets/fonts/NotoSerifHebrew-Regular.ttf
        - asset: assets/fonts/NotoSerifHebrew-Bold.ttf
          weight: 700
    # Display serifs: static instances built by tool/fonts/build_fonts.sh.
    # There is no 400. Bold is needed because Text switches to FontWeight.bold
    # when the platform's bold-text setting is on.
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-MediumItalic.ttf
          weight: 500
          style: italic
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre-Medium.ttf
          weight: 500
        - asset: assets/fonts/FrankRuhlLibre-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FrankRuhlLibre-Bold.ttf
          weight: 700
    # Interface fonts. Atkinson Hyperlegible Next, Lexend and OpenDyslexic
    # load on demand from assets/fonts/optional/.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
