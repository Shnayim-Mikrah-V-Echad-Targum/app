name: shnayim_mikra
description: "Shnayim Mikra v'Echad Targum — the weekly parsha twice in Hebrew and once in Targum, with daily and weekly streaks, community forums and extensive accessibility options."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  intl: any
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# Regenerate platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#1E4B8F"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FBF9F5"
    theme_color: "#1E4B8F"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/text/
    - assets/text/mikra/
    - assets/text/onkelos/
    - assets/text/english/
    - assets/text/rashi/
    - assets/text/rashi_en/
    - assets/fonts/licenses/

  fonts:
    # Scripture fonts. All support nikud and the full set of ta'amim.
    - family: NotoSerifHebrew
      fonts:
        - asset: assets/fonts/NotoSerifHebrew-Regular.ttf
        - asset: assets/fonts/NotoSerifHebrew-Bold.ttf
          weight: 700
    - family: TaameyFrank
      fonts:
        # Medium only: the Bold file renders cantillation marks invisibly.
        - asset: assets/fonts/TaameyFrankCLM-Medium.ttf
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/EzraSIL-Regular.ttf
    # Interface fonts.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
