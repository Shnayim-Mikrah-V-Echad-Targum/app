name: shnayim_mikra
description: "Shnayim Mikra v'Echad Targum — the weekly parsha twice in Hebrew and once in Targum, with daily and weekly streaks, community forums and extensive accessibility options."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  intl: any
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  # For tests of BackupFiles, which stand in for the platform's dialogs and
  # share sheet.
  file_selector_platform_interface: ^2.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  http: ^1.6.0
  share_plus_platform_interface: ^7.2.0

# Platform icons. Regenerate all of them with:
#   python3 tool/branding/make_icon.py && dart run flutter_launcher_icons \
#     && python3 tool/branding/make_icon.py --post
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#1D3F75"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # The art already sits inside the 66/108 safe circle.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: assets/branding/icon_dark.png
  image_path_ios_tinted_grayscale: assets/branding/icon_tinted.png
  web:
    generate: true
    background_color: "#FAF7F0"
    theme_color: "#1D3F75"
  windows:
    # make_icon.py --post writes the multi-size windows/runner/resources/app_icon.ico.
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/icon.png
    - assets/branding/mark_128.png
    - assets/data/
    - assets/text/
    - assets/text/mikra/
    - assets/text/onkelos/
    - assets/text/english/
    - assets/text/rashi/
    - assets/text/rashi_en/
    - assets/fonts/licenses/
    # Optional fonts: plain assets that OptionalFonts registers on first use,
    # so the web build does not download them at start-up.
    - assets/fonts/rashi/

  fonts:
    # Scripture fonts. All support nikud and the full set of ta'amim.
    - family: NotoSerifHebrew
      fonts:
        - asset: assets/fonts/NotoSerifHebrew-Regular.ttf
        - asset: assets/fonts/NotoSerifHebrew-Bold.ttf
          weight: 700
    - family: TaameyFrank
      fonts:
        # Medium only: the Bold file renders cantillation marks invisibly.
        - asset: assets/fonts/TaameyFrankCLM-Medium.ttf
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/EzraSIL-Regular.ttf
    # Display serifs: static instances built by tool/fonts/build_fonts.sh.
    # There is no 400. Bold is needed because Text switches to FontWeight.bold
    # when the platform's bold-text setting is on.
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-MediumItalic.ttf
          weight: 500
          style: italic
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre-Medium.ttf
          weight: 500
        - asset: assets/fonts/FrankRuhlLibre-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FrankRuhlLibre-Bold.ttf
          weight: 700
    # Interface fonts.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
